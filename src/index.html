<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphics Final Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #controls-gui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #controls-gui h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #fff;
        }
        #controls-gui div {
            margin: 5px 0;
        }
        #controls-gui .key {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="controls-gui">
        <h3 style="text-align:center; margin:0 0 10px 0;">Controls</h3>
        <div><span class="key">W</span> - Look Up</div>
        <div><span class="key">S</span> - Look Down</div>
        <div><span class="key">A</span> - Turn Left</div>
        <div><span class="key">D</span> - Turn Right</div>
        <div><span class="key">↑</span> - Move Forward</div>
        <div><span class="key">↓</span> - Move Backward</div>
        <div><span class="key">←</span> - Move Left</div>
        <div><span class="key">→</span> - Move Right</div>
    </div>
</body>
</html>
